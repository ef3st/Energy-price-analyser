[project]
name = "energy-price-analyser"
version = "0.1.0"
description = ""
authors = [
    {name = "Lorenzo Pepa",email = "pepalorenzo.work@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit (>=1.52.2,<2.0.0)",
    "polars (>=1.37.1,<2.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "statsmodels (>=0.14.6,<0.15.0)",
    "numpy (>=2.4.1,<3.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "joblib (>=1.5.3,<2.0.0)"
]

[tool.poetry]
packages = [{include = "energy_price_analyser", from = "src"}]


[tool.poetry.group.dev.dependencies]
black = "^25.12.0"
pytest = "^9.0.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]